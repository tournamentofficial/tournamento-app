<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Free Fire Tournament</title>

<style>

body{
margin:0;
font-family:Arial;
background:#071e22;
color:white;
}

.app{
max-width:420px;
margin:auto;
min-height:100vh;
background:#0c2b30;
}

header{
display:flex;
justify-content:space-between;
padding:15px;
background:#10363b;
}

.wallet{
background:#18e0d1;
color:black;
padding:5px 12px;
border-radius:20px;
}

.card{
background:#12383d;
margin:15px;
padding:15px;
border-radius:10px;
}

input{
padding:10px;
margin:6px;
border:none;
border-radius:6px;
width:80%;
}

button{
padding:10px 15px;
border:none;
border-radius:6px;
background:#18e0d1;
cursor:pointer;
}

.hidden{
display:none;
}

.bottom{
position:fixed;
bottom:0;
width:100%;
max-width:420px;
display:flex;
justify-content:space-around;
background:#10363b;
padding:10px;
}

#timer{
font-size:28px;
color:#18e0d1;
}

</style>

</head>

<body>

<div class="app">

<header>

<h3>🎮 FF Tournaments</h3>

<div class="wallet">

₹ <span id="wallet">0</span>

</div>

</header>

<!-- LOGIN -->

<div id="login">

<center>

<h2>Signup</h2>

<input id="suUser" placeholder="Username">

<input id="suPass" type="password" placeholder="Password">

<br>

<button onclick="signup()">Signup</button>

<h2>Login</h2>

<input id="liUser" placeholder="Username">

<input id="liPass" type="password" placeholder="Password">

<br>

<button onclick="login()">Login</button>

</center>

</div>


<!-- HOME -->

<div id="home" class="hidden">

<div class="card">

<h3>🔥 Free Fire Squad Match</h3>

Entry Fee: ₹20  
<br>
Players: <span id="slots">0</span>/40  
<br>
Prize: ₹400  

<br><br>

<button onclick="join()">Join Match</button>

</div>

</div>


<!-- PAYMENT -->

<div id="payment" class="hidden">

<center>

<h3>💳 Payment</h3>

<p>Pay ₹20 via UPI then enter Transaction ID</p>

<input id="txn" placeholder="Transaction ID">

<br>

<button onclick="submitPayment()">Submit</button>

<h3>Match Countdown</h3>

<p id="timer">30</p>

<h3>Room Details</h3>

<p id="room"></p>

</center>

</div>


<!-- ADMIN -->

<div id="admin" class="hidden">

<center>

<h3>Admin Panel</h3>

<p>Pending Payments</p>

<div id="requests"></div>

<p>Total Collection ₹ <span id="collection">0</span></p>

<p>Prize ₹400</p>

<p>Profit ₹ <span id="profit"></span></p>

</center>

</div>


<nav class="bottom hidden" id="nav">

<button onclick="showHome()">🏠</button>

<button onclick="showPayment()">💳</button>

<button onclick="adminLogin()">⚙️</button>

</nav>


</div>

<script>

let users=JSON.parse(localStorage.getItem("users"))||{}
let payments=JSON.parse(localStorage.getItem("payments"))||[]
let slots=Number(localStorage.getItem("slots"))||0

document.getElementById("slots").innerText=slots

function signup(){

let u=suUser.value
let p=suPass.value

users[u]={pass:p,wallet:0}

localStorage.setItem("users",JSON.stringify(users))

alert("Account created")

}

function login(){

let u=liUser.value
let p=liPass.value

if(users[u] && users[u].pass===p){

document.getElementById("login").classList.add("hidden")

document.getElementById("home").classList.remove("hidden")

document.getElementById("nav").classList.remove("hidden")

document.getElementById("wallet").innerText=users[u].wallet

}

else{

alert("Wrong login")

}

}

function showHome(){

home.classList.remove("hidden")
payment.classList.add("hidden")

}

function showPayment(){

payment.classList.remove("hidden")
home.classList.add("hidden")

}

function join(){

showPayment()

}

function submitPayment(){

let txn=document.getElementById("txn").value

payments.push(txn)

localStorage.setItem("payments",JSON.stringify(payments))

alert("Payment submitted. Wait admin approval.")

}

function adminLogin(){

let id=prompt("Admin ID")
let pass=prompt("Password")

if(id==="owner" && pass==="ffadmin"){

admin.classList.remove("hidden")

loadRequests()

}

}

function loadRequests(){

let html=""

payments.forEach((p,i)=>{

html+=`<div class="card">

Txn: ${p}

<br><br>

<button onclick="approve(${i})">Approve</button>

</div>`

})

requests.innerHTML=html

}

function approve(i){

payments.splice(i,1)

slots++

localStorage.setItem("slots",slots)

document.getElementById("slots").innerText=slots

localStorage.setItem("payments",JSON.stringify(payments))

let collection=slots*20

collectionDisplay(collection)

}

function collectionDisplay(c){

document.getElementById("collection").innerText=c

document.getElementById("profit").innerText=c-400

}

</script>

</body>
</html>
