<!DOCTYPE html>
<html>
<head>

<title>Tournamento Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🎮 Tournamento Pro</h1>

<div id="walletBox">
Wallet ₹<span id="wallet">0</span>
</div>

</header>


<section id="auth">

<h2>Player Login</h2>

<input id="loginUser" placeholder="Username">
<input id="loginPass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<h3>Create Account</h3>

<input id="regUser" placeholder="Username">
<input id="regPass" type="password" placeholder="Password">

<button onclick="register()">Register</button>

</section>



<section id="playerPanel" class="hidden">

<h2>Live Tournaments</h2>

<div id="tournamentList"></div>


<div id="paymentSection" class="hidden">

<h3>Enter UPI Transaction ID</h3>

<input id="txnInput">

<button onclick="submitPayment()">Submit</button>

</div>

<div id="roomSection" class="hidden">

<h3>Room Details</h3>

<p id="roomInfo"></p>

</div>

</section>



<section id="adminLogin">

<h2>Admin Login</h2>

<input id="adminUser" placeholder="Admin ID">
<input id="adminPass" type="password">

<button onclick="adminLogin()">Login</button>

</section>



<section id="adminPanel" class="hidden">

<h2>Admin Dashboard</h2>

<h3>Create Tournament</h3>

<input id="tTitle" placeholder="Title">
<input id="tEntry" placeholder="Entry Fee">
<input id="tSlots" placeholder="Slots">
<input id="tPrize" placeholder="Prize">

<button onclick="createTournament()">Create</button>


<h3>Pending Payments</h3>

<div id="paymentList"></div>


<h3>Profit Dashboard</h3>

<p>Total Collection ₹ <span id="totalCollection">0</span></p>

<p>Total Prize ₹ <span id="totalPrize">0</span></p>

<p>Your Profit ₹ <span id="profit">0</span></p>

</section>


<script src="app.js"></script>

</body>
</html>
