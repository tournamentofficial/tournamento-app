<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tournamento</title>

<style>

body{
background:#071c1f;
font-family:Arial;
color:white;
margin:0;
}

header{
background:#0d2b2f;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.wallet{
background:#00e0c6;
color:black;
padding:5px 10px;
border-radius:8px;
}

.container{
padding:20px;
}

.card{
background:#0f2d31;
border-radius:15px;
margin-bottom:20px;
overflow:hidden;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.card-body{
padding:15px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:linear-gradient(90deg,#ff00ff,#9d00ff);
border:none;
border-radius:10px;
color:white;
font-size:16px;
cursor:pointer;
}

.nav{
position:fixed;
bottom:0;
width:100%;
background:#0d2b2f;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.nav div{
text-align:center;
font-size:12px;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<header>

<h2>Tournamento</h2>

<div class="wallet">
₹ <span id="wallet">500</span>
</div>

</header>

<div class="container" id="home">

<div class="card">

<img src="https://images.unsplash.com/photo-1542751371-adc38448a05e">

<div class="card-body">

<h3>Free Fire - Ultimate Cup</h3>

<p>Prize Pool ₹2000</p>

<p>Entry Fee ₹50</p>

<p>Slots Left <span id="slots1">20</span>/48</p>

<button onclick="join(50,'room1')">
JOIN TOURNAMENT
</button>

</div>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1511512578047-dfb367046420">

<div class="card-body">

<h3>BGMI - Duo Domination</h3>

<p>Prize Pool ₹5000</p>

<p>Entry Fee ₹100</p>

<p>Slots Left <span id="slots2">42</span>/100</p>

<button onclick="join(100,'room2')">
JOIN TOURNAMENT
</button>

</div>

</div>

</div>


<div id="room" class="container hidden">

<h2>Room Details</h2>

<p>Status: Available</p>

<p>Room ID: 4589652</p>

<p>Password: 12345</p>

</div>
  <div id="registerBox" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000cc;
display:none;
justify-content:center;
align-items:center;
">

<div style="background:#0f2d31;padding:20px;border-radius:10px;width:300px">

<h3>Player Registration</h3>

<input id="playerName" placeholder="Player Name" style="width:100%;padding:10px;margin-top:10px">

<input id="playerUID" placeholder="Game UID" style="width:100%;padding:10px;margin-top:10px">

<button onclick="confirmJoin()" style="margin-top:15px;width:100%;padding:10px">
Confirm Join
</button>

</div>
</div>
  


<script>

let wallet=500;

let slots1=20;
let slots2=42;

function join(fee,room){

if(wallet<fee){
alert("Not enough wallet balance");
return;
}

wallet-=fee;

document.getElementById("wallet").innerText=wallet;

if(room=="room1"){
slots1--;
document.getElementById("slots1").innerText=slots1;
}

if(room=="room2"){
slots2--;
document.getElementById("slots2").innerText=slots2;
}

alert("Payment Successful");

document.getElementById("home").classList.add("hidden");
document.getElementById("room").classList.remove("hidden");

}

</script>


<div class="nav">

<div>Home</div>
<div>Events</div>
<div>Wallet</div>
<div>Profile</div>

</div>

</body>
</html>
