<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Free Fire Arena</title>

<style>

body{
font-family:Arial;
background:#0b1f23;
color:white;
text-align:center;
}

.container{
padding:20px;
}

input{
padding:10px;
margin:5px;
width:200px;
}

button{
padding:10px 20px;
background:#ff00ff;
border:none;
color:white;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<h2>Free Fire Arena</h2>

<!-- LOGIN PAGE -->

<div id="loginPage" class="container">

<h3>Login</h3>

<input id="loginUser" placeholder="Username"><br>

<input id="loginPass" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

<p>New player?</p>

<button onclick="showSignup()">Sign Up</button>

</div>


<!-- SIGNUP PAGE -->

<div id="signupPage" class="container hidden">

<h3>Create Account</h3>

<input id="signUser" placeholder="Username"><br>

<input id="signPass" type="password" placeholder="Password"><br>

<button onclick="signup()">Create Account</button>

</div>


<!-- HOME PAGE -->

<div id="homePage" class="container hidden">

<h3>Welcome to Free Fire Arena</h3>

<p>Select Game Mode</p>

<button onclick="alert('Bermuda Match')">Bermuda</button>

<button onclick="alert('Clash Squad')">Clash Squad</button>

<button onclick="alert('Lone Wolf')">Lone Wolf</button>

<br><br>

<button onclick="showUPI()">Add Money</button>

<button onclick="showAdmin()">Admin</button>

</div>


<!-- UPI PAGE -->

<div id="upiPage" class="container hidden">

<h3>UPI Payment</h3>

<p>Send payment to UPI ID:</p>

<h4>freefire@upi</h4>

<p>After payment admin will add wallet balance.</p>

</div>


<!-- ADMIN LOGIN -->

<div id="adminLogin" class="container hidden">

<h3>Admin Login</h3>

<input id="adminUser" placeholder="Admin Username"><br>

<input id="adminPass" type="password" placeholder="Password"><br>

<button onclick="adminLogin()">Login</button>

</div>


<!-- ADMIN DASHBOARD -->

<div id="adminPanel" class="container hidden">

<h3>Admin Dashboard</h3>

<p>Update Room ID</p>

<input placeholder="Room ID"><br>

<input placeholder="Password"><br>

<button>Update Room</button>

</div>


<script>

function showSignup(){
document.getElementById("loginPage").classList.add("hidden")
document.getElementById("signupPage").classList.remove("hidden")
}

function signup(){

fetch("/signup",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:document.getElementById("signUser").value,
password:document.getElementById("signPass").value
})
})
.then(r=>r.json())
.then(d=>{
if(d.status==="ok"){
alert("Account created")
location.reload()
}else{
alert("User exists")
}
})

}

function login(){

fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:document.getElementById("loginUser").value,
password:document.getElementById("loginPass").value
})
})
.then(r=>r.json())
.then(d=>{
if(d.status==="ok"){
document.getElementById("loginPage").classList.add("hidden")
document.getElementById("homePage").classList.remove("hidden")
}else{
alert("Login failed")
}
})

}

function showUPI(){

document.getElementById("homePage").classList.add("hidden")
document.getElementById("upiPage").classList.remove("hidden")

}

function showAdmin(){

document.getElementById("homePage").classList.add("hidden")
document.getElementById("adminLogin").classList.remove("hidden")

}

function adminLogin(){

let u=document.getElementById("adminUser").value
let p=document.getElementById("adminPass").value

if(u==="admin" && p==="12345"){
document.getElementById("adminLogin").classList.add("hidden")
document.getElementById("adminPanel").classList.remove("hidden")
}else{
alert("Wrong admin login")
}

}

</script>

</body>
</html>
