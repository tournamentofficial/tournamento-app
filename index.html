<!DOCTYPE html>
<html>
<head>
<title>Pro Tournament Arena</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
}

header{
background:#111;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
padding:20px;
}

input{
width:220px;
padding:10px;
margin:8px;
border:none;
border-radius:6px;
}

button{
background:#ff2bbf;
color:white;
border:none;
padding:10px 16px;
border-radius:6px;
cursor:pointer;
}

.card{
background:#1c1c1c;
padding:15px;
margin:10px 0;
border-radius:10px;
}

.hidden{
display:none;
}

nav{
background:#141414;
padding:10px;
display:flex;
justify-content:space-around;
}

nav button{
background:none;
border:none;
color:white;
font-size:16px;
}

.wallet{
font-size:20px;
margin:10px 0;
}

</style>

</head>

<body>

<header>
Pro Tournament Arena
</header>

<div class="container">

<!-- LOGIN PAGE -->

<div id="loginPage">

<h2>Login</h2>

<input id="loginUser" placeholder="Username / Admin ID"><br>
<input id="loginPass" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

<p>New Player?</p>

<button onclick="showSignup()">Create Account</button>

</div>

<!-- SIGNUP -->

<div id="signupPage" class="hidden">

<h2>Create Account</h2>

<input id="signupUser" placeholder="Username"><br>
<input id="signupPass" type="password" placeholder="Password"><br>

<button onclick="signup()">Register</button>

<br><br>

<button onclick="showLogin()">Back</button>

</div>

<!-- PLAYER DASHBOARD -->

<div id="playerPage" class="hidden">

<nav>
<button onclick="showSection('home')">Home</button>
<button onclick="showSection('wallet')">Wallet</button>
<button onclick="showSection('leaderboard')">Leaderboard</button>
<button onclick="logout()">Logout</button>
</nav>

<div id="home">

<h3>Available Tournaments</h3>

<div id="tournamentList"></div>

</div>

<div id="wallet" class="hidden">

<h3>Wallet</h3>

<div class="wallet">
Balance: ₹ <span id="walletAmount">0</span>
</div>

<h4>Deposit via UPI</h4>

<input id="depositAmount" placeholder="Amount">

<button onclick="deposit()">Request Deposit</button>

</div>

<div id="leaderboard" class="hidden">

<h3>Leaderboard</h3>

<div id="leaderboardList"></div>

</div>

</div>

<!-- ADMIN PANEL -->

<div id="adminPage" class="hidden">

<nav>
<button onclick="showAdmin('dashboard')">Dashboard</button>
<button onclick="showAdmin('create')">Create Tournament</button>
<button onclick="logout()">Logout</button>
</nav>

<div id="dashboard">

<h3>Admin Stats</h3>

<p>Total Earnings: ₹ <span id="earnings">0</span></p>
<p>Total Commission: ₹ <span id="commission">0</span></p>

</div>

<div id="create" class="hidden">

<h3>Create Tournament</h3>

<input id="tName" placeholder="Tournament Name"><br>
<input id="tFee" placeholder="Entry Fee"><br>
<input id="tPrize" placeholder="Prize"><br>

<button onclick="createTournament()">Create</button>

</div>

</div>

</div>

<script>

let currentUser=""

function showSignup(){
loginPage.classList.add("hidden")
signupPage.classList.remove("hidden")
}

function showLogin(){
signupPage.classList.add("hidden")
loginPage.classList.remove("hidden")
}

function showSection(id){

home.classList.add("hidden")
wallet.classList.add("hidden")
leaderboard.classList.add("hidden")

document.getElementById(id).classList.remove("hidden")

}

function showAdmin(id){

dashboard.classList.add("hidden")
create.classList.add("hidden")

document.getElementById(id).classList.remove("hidden")

}

function signup(){

alert("Signup function should connect to backend")

}

function login(){

const user=loginUser.value
const pass=loginPass.value

if(user==="shourya@1234" && pass==="8687049733"){

loginPage.classList.add("hidden")
adminPage.classList.remove("hidden")

return
}

currentUser=user

loginPage.classList.add("hidden")
playerPage.classList.remove("hidden")

loadTournaments()

}

function logout(){

location.reload()

}

function loadTournaments(){

let html=""

for(let i=1;i<=5;i++){

html+=`
<div class="card">
<h3>Solo Battle ${i}</h3>
Entry Fee: ₹50<br>
Prize: ₹500<br>
<button onclick="join(${i})">Join</button>
</div>
`

}

tournamentList.innerHTML=html

}

function join(id){

alert("Joined Tournament "+id)

}

function deposit(){

const amount=depositAmount.value

alert("Deposit request for ₹"+amount)

}

function createTournament(){

const name=tName.value

alert("Tournament Created: "+name)

}

</script>

</body>
</html>
